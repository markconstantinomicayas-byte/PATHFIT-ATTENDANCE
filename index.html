<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PATHFIT Attendance Portal</title>
  <style>
    :root {
      --primary: #800000;         /* Maroon */
      --primary-hover: #5c0000;   /* Dark Maroon */
      --accent: #d4af37;          /* Gold accent */
      --bg: #fdfbf7;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --success: #15803d;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header & Navigation */
    .header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      border-bottom: 4px solid var(--accent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-titles h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .header-titles p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: var(--primary);
    }

    /* Form Container */
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .form-group { margin-bottom: 18px; }
    
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--primary);
    }

    /* Input Fields Force Capital Letters visually */
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
      text-transform: uppercase;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    button.btn-submit {
      background-color: var(--primary);
      color: white;
      border: 2px solid var(--accent);
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      padding: 14px;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background-color: #dcfce7;
      color: var(--success);
      font-weight: 700;
      display: none;
      text-align: center;
      border: 1px solid #bbf7d0;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn-export { background: #16a34a; color: white; border: none; padding: 10px 16px; cursor: pointer; border-radius: 6px; font-weight: 600; }
    .btn-clear { background: var(--danger); color: white; border: none; padding: 10px 16px; cursor: pointer; border-radius: 6px; font-weight: 600; }

    .table-container { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f8fafc;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar (Logo Removed) -->
  <div class="header-card">
    <div class="brand">
      <div class="header-titles">
        <h2>COLEGIO DE SAN GABRIEL ARCANGEL</h2>
        <p>PATHFIT CLASS ATTENDANCE PORTAL</p>
      </div>
    </div>
    <button id="toggleViewBtn" class="nav-btn" onclick="toggleView()">ADMIN VIEW</button>
  </div>

  <!-- STUDENT VIEW -->
  <div id="studentView" class="card view active">
    <h3 style="color: var(--primary); margin-top: 0;">STUDENT ATTENDANCE FORM</h3>
    <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">* ALL FIELDS ARE REQUIRED AND MUST BE FILLED OUT IN ALL CAPS.</p>
    
    <form id="attendanceForm">
      <div class="form-group">
        <label for="subject">COURSE SUBJECT *</label>
        <select id="subject" required>
          <option value="">-- SELECT SUBJECT --</option>
          <option value="PATHFIT 1">PATHFIT 1</option>
          <option value="PATHFIT 3">PATHFIT 3</option>
        </select>
      </div>

      <div class="form-group">
        <label for="studentName">FULL NAME (LAST NAME, FIRST NAME) *</label>
        <input 
          type="text" 
          id="studentName" 
          placeholder="E.G., DELA CRUZ, JUAN" 
          required 
          oninput="this.value = this.value.toUpperCase()" 
        />
      </div>

      <div class="form-group">
        <label for="studentId">STUDENT ID NUMBER (NUMBERS ONLY) *</label>
        <input 
          type="text" 
          id="studentId" 
          placeholder="E.G., 20260123" 
          required 
          pattern="[0-9]+" 
          inputmode="numeric" 
          oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
        />
      </div>

      <div class="form-group">
        <label for="section">SECTION *</label>
        <select id="section" required>
          <option value="">-- SELECT SECTION --</option>
          <option value="BSIT 2-5">BSIT 2-5</option>
          <option value="BSIT 1-4">BSIT 1-4</option>
          <option value="TM 2-3">TM 2-3</option>
          <option value="TM 1-3">TM 1-3</option>
          <option value="BSP 2-1">BSP 2-1</option>
          <option value="AB 2-1">AB 2-1</option>
          <option value="BSES 2-1">BSES 2-1</option>
          <option value="BSM 2-1">BSM 2-1</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">SUBMIT ATTENDANCE</button>
    </form>
    <div id="statusMsg" class="status-msg">✓ ATTENDANCE SUBMITTED SUCCESSFULLY!</div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="adminView" class="card view">
    <h3 style="color: var(--primary); margin-top: 0;">INSTRUCTOR DASHBOARD</h3>
    
    <div class="filters">
      <div>
        <label for="filterSubject">FILTER SUBJECT</label>
        <select id="filterSubject" onchange="renderTable()">
          <option value="ALL">ALL SUBJECTS</option>
          <option value="PATHFIT 1">PATHFIT 1</option>
          <option value="PATHFIT 3">PATHFIT 3</option>
        </select>
      </div>
      <div>
        <label for="filterSection">FILTER SECTION</label>
        <select id="filterSection" onchange="renderTable()">
          <option value="ALL">ALL SECTIONS</option>
          <option value="BSIT 2-5">BSIT 2-5</option>
          <option value="BSIT 1-4">BSIT 1-4</option>
          <option value="TM 2-3">TM 2-3</option>
          <option value="TM 1-3">TM 1-3</option>
          <option value="BSP 2-1">BSP 2-1</option>
          <option value="AB 2-1">AB 2-1</option>
          <option value="BSES 2-1">BSES 2-1</option>
          <option value="BSM 2-1">BSM 2-1</option>
        </select>
      </div>
      <div>
        <label for="searchQuery">SEARCH STUDENT</label>
        <input type="text" id="searchQuery" placeholder="NAME OR ID..." oninput="this.value = this.value.toUpperCase(); renderTable();" />
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-export" onclick="exportToCSV()">EXPORT TO CSV/EXCEL</button>
      <button class="btn-clear" onclick="clearRecords()">CLEAR ALL LOGS</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>DATE & TIME</th>
            <th>SUBJECT</th>
            <th>SECTION</th>
            <th>STUDENT NAME</th>
            <th>ID NUMBER</th>
          </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // PASTE YOUR GOOGLE SCRIPT URL HERE:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxFpe87ny-biK-h-qyiLHOtFrYWOb0VkS2cl2bFLgrnv4wwnuU-nV_JOG2Tg_X87H9/exec";

    const ADMIN_PASSCODE = "admin123";
    let currentView = "student";

    const form = document.getElementById('attendanceForm');
    const statusMsg = document.getElementById('statusMsg');
    const tableBody = document.getElementById('attendanceTable');
    const toggleViewBtn = document.getElementById('toggleViewBtn');

    function toggleView() {
      if (currentView === "student") {
        const password = prompt("ENTER ADMIN PASSCODE:");
        if (password === ADMIN_PASSCODE) {
          currentView = "admin";
          document.getElementById('studentView').classList.remove('active');
          document.getElementById('adminView').classList.add('active');
          toggleViewBtn.textContent = "SWITCH TO STUDENT FORM";
          renderTable();
        } else if (password !== null) {
          alert("INCORRECT PASSCODE!");
        }
      } else {
        currentView = "student";
        document.getElementById('adminView').classList.remove('active');
        document.getElementById('studentView').classList.add('active');
        toggleViewBtn.textContent = "ADMIN VIEW";
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const subject = document.getElementById('subject').value.trim();
      const name = document.getElementById('studentName').value.trim().toUpperCase();
      const id = document.getElementById('studentId').value.trim();
      const section = document.getElementById('section').value.trim();

      // Strict Validation: Ensure no boxes are left blank
      if (!subject || !name || !id || !section) {
        alert("PLEASE FILL OUT ALL BOXES BEFORE SUBMITTING.");
        return;
      }

      // Ensure Student ID contains numbers only
      if (!/^\d+$/.test(id)) {
        alert("STUDENT ID MUST CONTAIN NUMBERS ONLY.");
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = "SUBMITTING...";

      const payload = {
        subject: subject,
        name: name,
        id: id,
        section: section
      };

      const newRecord = {
        date: new Date().toLocaleDateString(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        ...payload
      };
      const records = JSON.parse(localStorage.getItem('pathfitAttendance') || '[]');
      records.push(newRecord);
      localStorage.setItem('pathfitAttendance', JSON.stringify(records));

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT ATTENDANCE";
        statusMsg.style.display = 'block';
        setTimeout(() => statusMsg.style.display = 'none', 3000);
      })
      .catch(error => {
        console.error('Error submitting attendance:', error);
        alert('SAVED LOCALLY, BUT FAILED TO SYNC TO GOOGLE SHEETS.');
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT ATTENDANCE";
      });
    });

    function renderTable() {
      const records = JSON.parse(localStorage.getItem('pathfitAttendance') || '[]');
      const subjectFilter = document.getElementById('filterSubject').value;
      const sectionFilter = document.getElementById('filterSection').value;
      const query = document.getElementById('searchQuery').value.toUpperCase();

      tableBody.innerHTML = '';

      const filtered = records.filter(r => {
        const matchesSubject = (subjectFilter === 'ALL' || r.subject === subjectFilter);
        const matchesSection = (sectionFilter === 'ALL' || r.section === sectionFilter);
        const matchesQuery = r.name.toUpperCase().includes(query) || r.id.includes(query);
        return matchesSubject && matchesSection && matchesQuery;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">NO ATTENDANCE RECORDS FOUND.</td></tr>`;
        return;
      }

      filtered.reverse().forEach(rec => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${rec.date} ${rec.time}</td>
          <td><strong>${rec.subject}</strong></td>
          <td>${rec.section}</td>
          <td>${rec.name}</td>
          <td>${rec.id}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function exportToCSV() {
      const records = JSON.parse(localStorage.getItem('pathfitAttendance') || '[]');
      if (records.length === 0) {
        alert("NO RECORDS TO EXPORT!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,DATE,TIME,SUBJECT,SECTION,NAME,STUDENT ID\n";
      records.forEach(r => {
        csvContent += `"${r.date}","${r.time}","${r.subject}","${r.section}","${r.name}","${r.id}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `PATHFIT_Attendance_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearRecords() {
      if (confirm("ARE YOU SURE YOU WANT TO DELETE ALL ATTENDANCE RECORDS? THIS ACTION CANNOT BE UNDONE.")) {
        localStorage.removeItem('pathfitAttendance');
        renderTable();
      }
    }
  </script>
</body>
</html>
