<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PATHFIT Attendance Portal</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --success: #15803d;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .nav h2 { margin: 0; font-size: 18px; }

    .nav-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .nav-btn:hover { background: rgba(255, 255, 255, 0.3); }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    button.btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button.btn-submit:hover { background-color: var(--primary-hover); }

    .status-msg {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      background-color: #dcfce7;
      color: var(--success);
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn-export { background: #16a34a; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 6px; }
    .btn-clear { background: var(--danger); color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 6px; }

    .table-container { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th { background-color: #f8fafc; font-weight: 600; }
  </style>
</head>
<body>

  <div class="nav">
    <h2>PATHFIT Class Attendance</h2>
    <button id="toggleViewBtn" class="nav-btn" onclick="toggleView()">Switch to Admin View</button>
  </div>

  <!-- STUDENT VIEW -->
  <div id="studentView" class="card view active">
    <h3>Student Attendance Form</h3>
    <form id="attendanceForm">
      <div class="form-group">
        <label for="subject">Course Subject</label>
        <select id="subject" required>
          <option value="">-- Select Subject --</option>
          <option value="PATHFIT 1">PATHFIT 1</option>
          <option value="PATHFIT 3">PATHFIT 3</option>
        </select>
      </div>

      <div class="form-group">
        <label for="studentName">Full Name (Last Name, First Name)</label>
        <input type="text" id="studentName" placeholder="e.g., Dela Cruz, Juan" required />
      </div>

      <div class="form-group">
        <label for="studentId">Student ID Number</label>
        <input type="text" id="studentId" placeholder="e.g., 2026-01234" required />
      </div>

      <div class="form-group">
        <label for="section">Section</label>
        <select id="section" required>
          <option value="">-- Select Section --</option>
          <option value="BSIT 2-5">BSIT 2-5</option>
          <option value="BSIT 1-4">BSIT 1-4</option>
          <option value="TM 2-3">TM 2-3</option>
          <option value="TM 1-3">TM 1-3</option>
          <option value="BSP 2-1">BSP 2-1</option>
          <option value="AB 2-1">AB 2-1</option>
          <option value="BSES 2-1">BSES 2-1</option>
          <option value="BSM 2-1">BSM 2-1</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Submit Attendance</button>
    </form>
    <div id="statusMsg" class="status-msg">✓ Attendance submitted successfully!</div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="adminView" class="card view">
    <h3>Instructor Dashboard</h3>
    
    <div class="filters">
      <div>
        <label for="filterSubject">Filter Subject</label>
        <select id="filterSubject" onchange="renderTable()">
          <option value="ALL">All Subjects</option>
          <option value="PATHFIT 1">PATHFIT 1</option>
          <option value="PATHFIT 3">PATHFIT 3</option>
        </select>
      </div>
      <div>
        <label for="filterSection">Filter Section</label>
        <select id="filterSection" onchange="renderTable()">
          <option value="ALL">All Sections</option>
          <option value="BSIT 2-5">BSIT 2-5</option>
          <option value="BSIT 1-4">BSIT 1-4</option>
          <option value="TM 2-3">TM 2-3</option>
          <option value="TM 1-3">TM 1-3</option>
          <option value="BSP 2-1">BSP 2-1</option>
          <option value="AB 2-1">AB 2-1</option>
          <option value="BSES 2-1">BSES 2-1</option>
          <option value="BSM 2-1">BSM 2-1</option>
        </select>
      </div>
      <div>
        <label for="searchQuery">Search Student</label>
        <input type="text" id="searchQuery" placeholder="Name or ID..." oninput="renderTable()" />
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-export" onclick="exportToCSV()">Export to CSV/Excel</button>
      <button class="btn-clear" onclick="clearRecords()">Clear All Logs</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Subject</th>
            <th>Section</th>
            <th>Student Name</th>
            <th>ID Number</th>
          </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // PASTE YOUR GOOGLE SCRIPT LINK BETWEEN THE QUOTES BELOW:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxFpe87ny-biK-h-qyiLHOtFrYWOb0VkS2cl2bFLgrnv4wwnuU-nV_JOG2Tg_X87H9/exec";

    const ADMIN_PASSCODE = "admin123";
    let currentView = "student";

    const form = document.getElementById('attendanceForm');
    const statusMsg = document.getElementById('statusMsg');
    const tableBody = document.getElementById('attendanceTable');
    const toggleViewBtn = document.getElementById('toggleViewBtn');

    function toggleView() {
      if (currentView === "student") {
        const password = prompt("Enter Admin Passcode:");
        if (password === ADMIN_PASSCODE) {
          currentView = "admin";
          document.getElementById('studentView').classList.remove('active');
          document.getElementById('adminView').classList.add('active');
          toggleViewBtn.textContent = "Switch to Student Form";
          renderTable();
        } else if (password !== null) {
          alert("Incorrect passcode!");
        }
      } else {
        currentView = "student";
        document.getElementById('adminView').classList.remove('active');
        document.getElementById('studentView').classList.add('active');
        toggleViewBtn.textContent = "Switch to Student View";
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const payload = {
        subject: document.getElementById('subject').value,
        name: document.getElementById('studentName').value,
        id: document.getElementById('studentId').value,
        section: document.getElementById('section').value
      };

      const newRecord = {
        date: new Date().toLocaleDateString(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        ...payload
      };
      const records = JSON.parse(localStorage.getItem('pathfitAttendance') || '[]');
      records.push(newRecord);
      localStorage.setItem('pathfitAttendance', JSON.stringify(records));

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Attendance";
        statusMsg.style.display = 'block';
        setTimeout(() => statusMsg.style.display = 'none', 3000);
      })
      .catch(error => {
        console.error('Error submitting attendance:', error);
        alert('Saved locally, but failed to sync to Google Sheets.');
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Attendance";
      });
    });

    function renderTable() {
      const records = JSON.parse(localStorage.getItem('pathfitAttendance') || '[]');
      const subjectFilter = document.getElementById('filterSubject').value;
      const sectionFilter = document.getElementById('filterSection').value;
      const query = document.getElementById('searchQuery').value.toLowerCase();

      tableBody.innerHTML = '';

      const filtered = records.filter(r => {
        const matchesSubject = (subjectFilter === 'ALL' || r.subject === subjectFilter);
        const matchesSection = (sectionFilter === 'ALL' || r.section === sectionFilter);
        const matchesQuery = r.name.toLowerCase().includes(query) || r.id.toLowerCase().includes(query);
        return matchesSubject && matchesSection && matchesQuery;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">No attendance records found.</td></tr>`;
        return;
      }

      filtered.reverse().forEach(rec => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${rec.date} ${rec.time}</td>
          <td><strong>${rec.subject}</strong></td>
          <td>${rec.section}</td>
          <td>${rec.name}</td>
          <td>${rec.id}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function exportToCSV() {
      const records = JSON.parse(localStorage.getItem('pathfitAttendance') || '[]');
      if (records.length === 0) {
        alert("No records to export!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Date,Time,Subject,Section,Name,Student ID\n";
      records.forEach(r => {
        csvContent += `"${r.date}","${r.time}","${r.subject}","${r.section}","${r.name}","${r.id}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `PATHFIT_Attendance_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearRecords() {
      if (confirm("Are you sure you want to delete all attendance records? This action cannot be undone.")) {
        localStorage.removeItem('pathfitAttendance');
        renderTable();
      }
    }
  </script>
</body>
</html>
